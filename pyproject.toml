[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vilr"
version = "0.1.0"
description = "Verifiable Intent & Transaction Integrity Gateway"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0",
    "cryptography>=43.0",
    "PyJWT[crypto]>=2.9",
    "rfc8785>=0.1",
    "structlog>=24.0",
    "anthropic>=0.40",
    "google-genai>=0.5.0",
    "fakeredis>=2.0",
    "aiosqlite>=0.20",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "adapters*"]
